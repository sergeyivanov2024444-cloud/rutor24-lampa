name: Rutor rating and Pages
on:
  workflow_dispatch:
  schedule:
    - cron: '13,43 * * * *'
  push:
    branches: [main]
    paths-ignore: [site/rating.json]
concurrency:
  group: rutor24-pages
  cancel-in-progress: false
permissions: {}
jobs:
  snapshot:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pages: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Verify startup and recovery of home rows
        run: node --test tests/*.test.cjs
      - name: Fetch and validate the official daily table
        run: python3 scripts/update.py
      - name: Keep last successful snapshot in the repository
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site/rating.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update Rutor daily snapshot'
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
      - uses: actions/configure-pages@v5
        id: pages
      - name: Prepare the HTTPS distribution
        env:
          PAGES_BASE: ${{ steps.pages.outputs.base_url }}
        run: python3 scripts/build_pages.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy the verified snapshot and extensions
        id: deployment
        uses: actions/deploy-pages@v4
